events {}

http {
    # Define the upstream server for the backend
    upstream backend {
        server backend:10000;
    }

    # Define the upstream server for the frontend
    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name your_domain.com; # Replace with your domain

        # --- HTTPS/SSL Configuration ( uncomment and configure after obtaining certs ) ---
        # listen 443 ssl;
        # server_name mlt.company.com;

        # ssl_certificate /etc/nginx/certs/fullchain.pem;
        # ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # # Improve SSL security
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256';
        # ssl_prefer_server_ciphers off;
        # ssl_session_cache shared:SSL:10m;
        # ssl_session_timeout 10m;

        # # Redirect HTTP to HTTPS
        # if ($scheme != "https") {
        #     return 301 https://$host$request_uri;
        # }
        # ---------------------------------------------------------------------------------

        # Proxy requests to the backend API
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy requests to the frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Increase max body size to allow for large file uploads
        client_max_body_size 100M;
    }
}
