services:
  - type: web
    runtime: docker
    name: mlt-backend
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/templates

  - type: web
    runtime: static
    name: mlt-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://mlt-backend.onrender.com
