services:
  - type: web
    runtime: docker
    name: mlt-backend
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    preDeployCommand: sh scripts/predeploy.sh
    healthCheckPath: /api/v1/templates
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mlt-documentcompare-db
          property: connectionString

  - type: web
    runtime: static
    name: mlt-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://mlt-backend.onrender.com

databases:
  - name: mlt-documentcompare-db
    databaseName: mlt_documentcompare
    user: mlt_user
    plan: free
