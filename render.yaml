services:
  - type: web
    runtime: docker
    name: mlt-backend
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh scripts/start-render.sh
    healthCheckPath: /api/v1/templates
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: web
    runtime: static
    name: mlt-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://mlt-backend-bufr.onrender.com
