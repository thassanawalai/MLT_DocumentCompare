services:
  - type: web
    runtime: docker
    name: mlt-backend
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh -c 'sh scripts/predeploy.sh && exec uvicorn app.main:app --host 0.0.0.0 --port 10000'
    healthCheckPath: /api/v1/templates
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: web
    runtime: static
    name: mlt-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://mlt-backend-bufr.onrender.com
