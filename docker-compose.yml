services:
  backend:
    build: ./backend
    ports:
      # Available only to Nginx running on this server, never the Internet.
      - "127.0.0.1:10000:10000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # Available only to Nginx running on this server, never the Internet.
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
