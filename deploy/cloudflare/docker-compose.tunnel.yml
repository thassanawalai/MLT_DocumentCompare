services:
  mlt-demo-proxy:
    image: nginx:stable-alpine
    volumes:
      - ./nginx-demo.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tunnel
      - mlt_app
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --protocol http2 --url http://mlt-demo-proxy:80
    depends_on:
      - mlt-demo-proxy
    networks:
      - tunnel
    restart: unless-stopped

networks:
  tunnel:
  mlt_app:
    external: true
    name: mlt_default
