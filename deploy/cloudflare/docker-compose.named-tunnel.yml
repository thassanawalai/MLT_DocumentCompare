services:
  mlt-demo-proxy:
    image: nginx:stable-alpine
    volumes:
      - ./nginx-demo.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tunnel
      - mlt_app
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?Set TUNNEL_TOKEN before starting the named tunnel}
    depends_on:
      - mlt-demo-proxy
    networks:
      - tunnel
    restart: unless-stopped

networks:
  tunnel:
  mlt_app:
    external: true
    name: mlt_default
